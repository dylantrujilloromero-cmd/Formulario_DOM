<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="/Formulario_Dylan/CSS/style.css">
</head>
<body>

  <form>
    <h2>Formulario de Registro</h2>

    <label>Nombre:</label>
    <input type="text" placeholder="EJ: Dylan" required>

    <label>Apellido:</label>
    <input type="text" placeholder="EJ: Trujillo" required>

    <label>Tipo de Documento:</label>
    <select>   
      <option>Registro Medico</option>
      <option>Cédula de Ciudadanía</option>
      <option>Pasaporte</option>
      <option>Cédula de Extranjería</option>
    </select>

    <label>DNI / Número de Documento:</label>
    <input type="text" placeholder="EJ: 123456789" required>

    <label>Fecha de Nacimiento:</label>
    <input type="date">

    <label>Número de teléfono:</label>
    <input type="tel" placeholder="EJ: 123456789" required>

    <label>Email:</label>
    <input type="email" placeholder="correo@correo.com" required>

    <label>País Domicilio:</label>
    <input type="text" placeholder="EJ: España" required>

    <label>Ciudad Domicilio:</label>
    <input type="text" placeholder="Madrid" required>

    <label>
      <input type="checkbox"> Acepto el tratamiento de datos personales
    </label>

    <button type="submit">Enviar datos</button>
  </form>

</body>
</html>
